        const val = showBaseStats ? getBaseStat(item,h) : (stats?.stats?.[h]?.value||0);
        return {hash:h, name:ARMOR_STAT_NAMES[h], val};
      }).filter(s=>s.val>0);
      const total = showBaseStats ? getBaseStatTotal(item) : entries.reduce((a,s)=>a+s.val,0);
      if (entries.length) {
        statsHtml = `<div class="stats-section">
          <div class="perks-label">Stats${showBaseStats?' <span style="font-size:10px;color:var(--text-dim)">(base)</span>':''} <span style="color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;margin-left:8px;">Total: ${total}</span></div>
          ${entries.map(s=>{
            const isBest = maxPerStat[s.hash]===s.val && items.length>1 && s.val>0;
            return `<div class="stat-row">
              <div class="stat-row-label" style="${isBest?'color:var(--fav);':''}">${s.name}${isBest?' ★':''}</div>
              <div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${Math.min(s.val,100)}%;${isBest?'background:var(--fav);':''}"></div></div>
              <div class="stat-row-val" style="${isBest?'color:var(--fav);':''}">${s.val}</div>
            </div>`;
          }).join('')}
        </div>`;
      }
    }

    return `<div class="compare-item" id="citem-${iid}">
      <div class="compare-item-header" style="display:flex;align-items:flex-start;gap:12px;">
        <div class="compare-item-icon">${icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="compare-item-name">${name}</div>
          <div class="compare-item-meta">${damageIcon(def)} ${def?.itemTypeAndTierDisplayName||''} <span class="loc-badge">${loc}${item.equipped?' · Equipped':''}</span></div>
          <div class="compare-item-power">${power}</div>
        </div>
        <div class="mark-row" data-iid="${iid}" data-type="${type}" style="flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
          <div style="display:flex;gap:3px;">
            <button class="mark-btn fav ${getLockBtnClass(iid)}" data-mark="fav" style="padding:4px 8px;font-size:11px;" title="${getLockBtnTitle(iid)}">🔒 Lock</button>
            <button class="mark-btn junk ${mark==='junk'?'active':''}" data-mark="junk" style="padding:4px 8px;font-size:11px;">Junk</button>
            <button class="mark-btn infuse ${mark==='infuse'?'active':''}" data-mark="infuse" style="padding:4px 8px;font-size:11px;">Infuse</button>
            <button class="mark-btn clear-btn" data-mark="clear" style="padding:4px 8px;font-size:11px;">✕</button>
          </div>
        </div>
      </div>
      ${perksHtml}
      ${statsHtml}
    </div>`;
  }).join('');

  document.getElementById('compareContent').innerHTML = `
    <div class="compare-title">${name0} — ${items.length > 1 ? items.length + ' copies' : 'Item Detail'}</div>
    ${controlsHtml}
    <div class="compare-grid" style="${gridStyle}">${itemsHtml}</div>`;

  // Armor sort selects
  document.querySelectorAll('#compareContent .armor-sort-sel').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const idx = Number(sel.dataset.idx);
      armorSort[idx].stat = sel.value;
      renderCompare(instanceIds, type);
    });
  });
  document.querySelectorAll('#compareContent .sort-dir-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.idx);
      armorSort[idx].dir *= -1;
      renderCompare(instanceIds, type);
    });
  });

  // Base stats toggle
  const baseToggleEl = document.getElementById('baseStatsToggle');
  if (baseToggleEl) baseToggleEl.addEventListener('change', ()=>{
    showBaseStats = baseToggleEl.checked;
    renderCompare(instanceIds, type);
  });

  // Weapon stats toggle
  const weaponStatsEl = document.getElementById('weaponStatsToggle');
  if (weaponStatsEl) weaponStatsEl.addEventListener('change', ()=>{
    showWeaponStats = weaponStatsEl.checked;
    renderCompare(instanceIds, type);
  });

  // Mark buttons
  document.querySelectorAll('#compareContent .mark-row').forEach(row=>{
    const iid = row.dataset.iid;
    const t   = row.dataset.type;
    row.querySelectorAll('.mark-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const m = btn.dataset.mark;
        setMark(iid, m==='clear'?null:m, t, instanceIds);
      });
    });
  });
}

function setMark(instanceId, mark, type, instanceIds) {
  saveMark(instanceId, mark);
  if (type!=='weapon') renderCompare(instanceIds, type);
  if (type==='weapon' && activeWeaponBHash && activeWeaponType) {
    selectWeaponType(activeWeaponBHash, activeWeaponType);
  } else if (type==='armor' && activeArmorClass!==null && activeArmorSlot) {
    selectArmorSlot(activeArmorClass, activeArmorSlot);
  }
}

function resortCompare(sort, instanceIds, type) {
  compareSort = sort;
  renderCompare(instanceIds, type);
}

// ===================== FAVORITES & JUNK TABS =====================

function getDimDone(iid) { return !!JSON.parse(localStorage.getItem('d2dim')||'{}')[iid]; }
function setDimDone(iid, val) {
  const d = JSON.parse(localStorage.getItem('d2dim')||'{}');
  if (val) d[iid]=1; else delete d[iid];
  localStorage.setItem('d2dim', JSON.stringify(d));
}

const openNameAccordions = {junk:{}, fav:{}};
const markTabSort = {junk:{col:'power',dir:-1}, fav:{col:'power',dir:-1}};

function buildMarkRows(markType) {
  return allItems
    .filter(i=>{
      if (getMark(i.itemInstanceId)!==markType || !i.itemInstanceId) return false;
      const b = getEffectiveBucketHash(i);
      return WEAPON_BUCKETS.has(b) || ARMOR_BUCKETS.has(b);
    })
    .map(item=>{
      const def   = getItemDef(item.itemHash);
      const inst  = instanceData[item.itemInstanceId];
      const socks = socketData[item.itemInstanceId];
      const stats = statsData[item.itemInstanceId];
      const name  = def?.displayProperties?.name||'Unknown';
      const typeLabel = def?.itemTypeDisplayName||'';
      const tier  = def?.inventory?.tierType||0;
      const rk    = RARITY[tier]||'common';
      const power = inst?.primaryStat?.value||0;
      const effectiveBucket = getEffectiveBucketHash(item);
      const isWeapon = WEAPON_BUCKETS.has(effectiveBucket);
      const isArmor  = ARMOR_BUCKETS.has(effectiveBucket);
      const category = isWeapon?'Weapon':isArmor?'Armor':'Other';
      const slotName = isWeapon
        ? (WEAPON_BUCKET_NAMES[effectiveBucket]||'Weapon')
        : (ARMOR_BUCKET_NAMES[effectiveBucket]||'Armor');
      const icon = def?.displayProperties?.hasIcon ? def.displayProperties.icon : null;
      const perks = [];
      if (socks?.sockets) {
        socks.sockets.forEach(s=>{
          if (!s.plugHash) return;
          const pd = getItemDef(s.plugHash);
          if (!pd) return;
          const plug = pd.plug?.plugCategoryIdentifier||'';
          if (plug.includes('traits')||plug.includes('perks')||plug.includes('frames')||plug.includes('intrinsics'))
            perks.push({name:pd.displayProperties?.name, icon:pd.displayProperties?.hasIcon?pd.displayProperties.icon:null});
        });
      }
      const armorStats = {};
      if (stats?.stats) ARMOR_STAT_HASHES.forEach(h=>{ if(stats.stats[h]?.value) armorStats[h]=stats.stats[h].value; });
      return {item, name, typeLabel, tier, rk, power, category, slotName, icon, perks, armorStats,
              iid:item.itemInstanceId, loc:item.loc||'', equipped:item.equipped||false};
    });
}

function renderMarkTab(markType) {
  const panelId = markType==='junk'?'panel-junk':'panel-favorites';
  const panel   = document.getElementById(panelId);
  const emptyLabel = markType==='junk'?'No items marked as junk yet.':'No items marked as locked yet.';
  const accentColor = markType==='junk'?'var(--junk)':'var(--fav)';

  const rows = buildMarkRows(markType);
  if (!rows.length) {
    panel.innerHTML=`<div class="no-junk">${emptyLabel}<br><span style="font-size:12px;color:var(--text-dim);margin-top:6px;display:block;">Mark items in the Weapons or Armor tabs.</span></div>`;
    return;
  }

  const sort = markTabSort[markType] || {col:'power', dir:-1};

  function sortRows(arr) {
    return [...arr].sort((a,b)=>{
      const da=getDimDone(a.iid)?1:0, db=getDimDone(b.iid)?1:0;
      if (da!==db) return da-db;
      if (sort.col==='power') return (b.power-a.power)*sort.dir;
      if (sort.col==='name') return a.name.localeCompare(b.name)*sort.dir;
      if (sort.col==='loc') return a.loc.localeCompare(b.loc)*sort.dir;
      const h = Number(sort.col);
      return ((b.armorStats[h]||0)-(a.armorStats[h]||0))*sort.dir;
    });
  }

  function thHtml(col, label, category) {
    const active = sort.col===col;
    const arrow  = active?(sort.dir===1?'\u2191':'\u2193'):'';
    return `<th class="${active?'sorted':''}" data-col="${col}" data-tab="${markType}" data-cat="${category||''}">${label}<span class="sort-arrow">${arrow}</span></th>`;
  }

  function markBtns(r) {
    const m = getMark(r.iid);
    return `<div style="display:flex;align-items:center;gap:3px;">
      <button class="mark-btn fav ${getLockBtnClass(r.iid)}" data-iid="${r.iid}" data-mark="fav" data-tab="${markType}" data-pending="" title="${getLockBtnTitle(r.iid)}" style="padding:4px 10px;font-size:13px;">🔒</button>
      <button class="mark-btn junk ${m==='junk'?'active':''}" data-iid="${r.iid}" data-mark="junk" data-tab="${markType}" data-pending="" style="padding:4px 10px;font-size:12px;">Junk</button>
      <button class="mark-btn infuse ${m==='infuse'?'active':''}" data-iid="${r.iid}" data-mark="infuse" data-tab="${markType}" data-pending="" style="padding:4px 10px;font-size:13px;">&#9889;</button>
      <button class="mark-btn clear-btn" data-iid="${r.iid}" data-mark="clear" data-tab="${markType}" data-pending="" style="padding:4px 10px;font-size:13px;">&#215;</button>
      <button class="confirm-mark-btn" data-iid="${r.iid}" data-tab="${markType}" style="display:none;background:var(--fav);color:#0a0c0f;border:none;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;cursor:pointer;">OK</button>
    </div>`;
  }

  function rowHtml(r) {
    const done = getDimDone(r.iid);
    const armorCells = r.category==='Armor'
      ? ARMOR_STAT_HASHES.map(h=>`<td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:${r.armorStats[h]?'var(--text)':'var(--text-dim)'};">${r.armorStats[h]||'&#8212;'}</td>`).join('')
      : '';
    return `<tr class="${done?'done-in-dim':''}" data-iid="${r.iid}">
      <td class="dim-check-cell"><input type="checkbox" class="dim-checkbox" ${done?'checked':''} data-iid="${r.iid}" data-tab="${markType}" /></td>
      <td><div class="junk-name-cell">
        <div class="rarity-dot ${r.rk}"></div>
        <div class="junk-icon">${r.icon?`<img src="https://www.bungie.net${r.icon}" />`:'?'}</div>
        <div><div class="junk-item-name">${r.name}</div><div class="junk-item-sub">${r.typeLabel}</div></div>
      </div></td>
      <td class="power-cell">${r.power||'&#8212;'}</td>
      <td class="loc-cell">${r.loc}${r.equipped?'<span class="equipped-tag">Equipped</span>':''}</td>
      <td><div class="perks-cell">${r.perks.slice(0,3).map(p=>`<div class="perk-mini">${p.icon?`<img src="https://www.bungie.net${p.icon}" />`:''}
        <span>${p.name||''}</span></div>`).join('')}</div></td>
      ${armorCells}
      <td><div style="display:flex;gap:3px;">${markBtns(r)}</div></td>
    </tr>`;
  }

  // Build slot map grouped by category then slot
  const WEAPON_SLOT_ORDER = ['Kinetic','Energy','Heavy'];
  const ARMOR_SLOT_ORDER  = ['Helmet','Gauntlets','Chest','Legs','Class Item'];

  function buildCategoryHtml(category, slotOrder) {
    const catRows = rows.filter(r=>r.category===category);
    if (!catRows.length) return '';

    const slotMap = {};
    catRows.forEach(r=>{
      if (!slotMap[r.slotName]) slotMap[r.slotName]={names:{}};
      if (!slotMap[r.slotName].names[r.name]) slotMap[r.slotName].names[r.name]=[];
      slotMap[r.slotName].names[r.name].push(r);
    });

    const orderedSlots = slotOrder.filter(s=>slotMap[s])
      .concat(Object.keys(slotMap).filter(s=>!slotOrder.includes(s)));

    const slotsHtml = orderedSlots.map(slotName=>{
      const slot = slotMap[slotName];
      const totalItems = Object.values(slot.names).flat().length;
      const accordionKey = `${markType}:${category}:${slotName}`;

      const nameAccs = Object.entries(slot.names).map(([name, nameRows])=>{
        const def = getItemDef(nameRows[0].item.itemHash);
        const icon = def?.displayProperties?.hasIcon?def.displayProperties.icon:null;
        const nameKey = `${accordionKey}:${name}`;
        const isOpen = (openNameAccordions[markType]||{})[nameKey];
        const sorted = sortRows(nameRows);
        const doneCount = nameRows.filter(r=>getDimDone(r.iid)).length;
        const rk = nameRows[0].rk;
        const armorStatHeaders = category==='Armor'
          ? ARMOR_STAT_HASHES.map(h=>thHtml(String(h), ARMOR_STAT_NAMES[h], category)).join('')
          : '';
        return `<div class="name-accordion">
          <div class="name-accordion-header ${isOpen?'open':''}" data-rawkey="${encodeURIComponent(nameKey)}" data-tab="${markType}">
            <div class="rarity-bar rarity-${rk}" style="width:3px;align-self:stretch;flex-shrink:0;margin-right:4px;"></div>
            <div class="name-acc-icon">${icon?`<img src="https://www.bungie.net${icon}" />`:'?'}</div>
            <span class="name-acc-title">${name}</span>
            <span class="name-acc-count">${nameRows.length} item${nameRows.length>1?'s':''} ${doneCount>0?'&#183; <span style="color:var(--accent)">'+doneCount+' done</span>':''}</span>
            <span class="name-acc-arrow">&#9660;</span>
          </div>
          <div class="name-accordion-body ${isOpen?'open':''}">
            <table class="junk-table">
              <thead><tr>
                <th style="width:32px;"></th>
                ${thHtml('name','Item',category)}
                ${thHtml('power','Power',category)}
                ${thHtml('loc','Location',category)}
                <th>Perks</th>
                ${armorStatHeaders}
                <th>Mark</th>
              </tr></thead>
              <tbody>${sorted.map(rowHtml).join('')}</tbody>
            </table>
          </div>
        </div>`;
      }).join('');

      // Slot sub-accordion — collapsed by default (undefined = closed)
      const isSlotOpen = (openNameAccordions[markType]||{})[accordionKey] === true;
      return `<div class="accordion" style="margin-bottom:4px;">
        <div class="accordion-header ${isSlotOpen?'open':''}" data-rawkey="${encodeURIComponent(accordionKey)}" data-tab="${markType}" data-slot-acc="1">
          <span class="accordion-title">${slotName}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="accordion-count">${totalItems} items</span>
            <span class="accordion-arrow">▼</span>
          </span>
        </div>
        <div class="accordion-body ${isSlotOpen?'open':''}">${nameAccs}</div>
      </div>`;
    }).join('');

    // Category = plain section header, not collapsible
    return `<div style="margin-bottom:16px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);padding:10px 0 8px;border-bottom:2px solid var(--accent);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
        <span>${category}s</span>
        <span style="font-size:11px;font-weight:400;color:var(--text-dim);letter-spacing:.04em;">${catRows.length} items</span>
      </div>
      ${slotsHtml}
    </div>`;
  }

  const weaponsHtml = buildCategoryHtml('Weapon', WEAPON_SLOT_ORDER);
  const armorHtml   = buildCategoryHtml('Armor',  ARMOR_SLOT_ORDER);

  const doneCount = rows.filter(r=>getDimDone(r.iid)).length;
  const pendingCount = markType==='fav' ? rows.filter(r=>{
    const appLocked = getMark(r.iid)==='fav';
    const gameLocked = inGameLockState[r.iid]||false;
    return appLocked !== gameLocked;
  }).length : 0;
  const syncBtn = markType==='fav' ? `<button id="syncLocksBtn" onclick="syncLocksToGame()"
    style="background:${pendingCount?'var(--accent)':'var(--surface2)'};color:${pendingCount?'#0a0c0f':'var(--text-muted)'};border:1px solid ${pendingCount?'var(--accent)':'var(--border2)'};font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;cursor:pointer;">
    ${pendingCount?`Sync to Game (${pendingCount} pending)`:'Sync to Game'}
  </button>` : '';

  panel.innerHTML = `
    <div class="mark-controls">
      <span style="font-size:13px;color:var(--text-muted);">${rows.length} items &#183; <span style="color:${accentColor}">${doneCount} done in DIM</span></span>
      ${syncBtn}
      <button class="unmark-btn" id="clearDimBtn" data-tab="${markType}" style="margin-left:auto;">Clear all DIM checks</button>
    </div>
    ${weaponsHtml}${armorHtml}`;

  // Slot accordion toggles
  panel.querySelectorAll('.accordion-header[data-slot-acc]').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const rawKey = decodeURIComponent(hdr.dataset.rawkey);
      const tab = hdr.dataset.tab;
      if (!openNameAccordions[tab]) openNameAccordions[tab]={};
      openNameAccordions[tab][rawKey] = !openNameAccordions[tab][rawKey];
      renderMarkTab(tab);
    });
  });

  // Name-level accordion toggles
  panel.querySelectorAll('.name-accordion-header').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const rawKey = decodeURIComponent(hdr.dataset.rawkey);
      const tab = hdr.dataset.tab;
      if (!openNameAccordions[tab]) openNameAccordions[tab]={};
      openNameAccordions[tab][rawKey] = !openNameAccordions[tab][rawKey];
      renderMarkTab(tab);
    });
  });

  // Sort by column header click
  panel.querySelectorAll('.junk-table th[data-col]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const tab = th.dataset.tab;
      const col = th.dataset.col;
      const s = markTabSort[tab] || (markTabSort[tab]={col:'power',dir:-1});
      if (s.col===col) s.dir*=-1; else { s.col=col; s.dir=-1; }
      renderMarkTab(tab);
    });
  });

  panel.querySelectorAll('.dim-checkbox').forEach(cb=>{
    cb.addEventListener('change', ()=>{ setDimDone(cb.dataset.iid, cb.checked); renderMarkTab(cb.dataset.tab); });
  });

  panel.querySelectorAll('.mark-btn[data-iid]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const iid = btn.dataset.iid;
      const tab = btn.dataset.tab;
      const newMark = btn.dataset.mark==='clear'?null:btn.dataset.mark;
      const row = btn.closest('tr');
      if (row) {
        row.querySelectorAll('.mark-btn[data-iid]').forEach(b=>b.classList.remove('pending-select'));
        btn.classList.add('pending-select');
        btn.dataset.pending = newMark===null?'clear':newMark;
        const confirmBtn = row.querySelector('.confirm-mark-btn');
        if (confirmBtn) confirmBtn.style.display='block';
      }
    });
  });

  panel.querySelectorAll('.confirm-mark-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const iid = btn.dataset.iid;
      const tab = btn.dataset.tab;
      const row = btn.closest('tr');
      const pendingBtn = row?.querySelector('.mark-btn.pending-select');
      if (!pendingBtn) return;
      const m = pendingBtn.dataset.pending;
      saveMark(iid, m==='clear'?null:m);
      renderMarkTab(tab);
    });
  });

  panel.querySelector('#clearDimBtn')?.addEventListener('click', ()=>{
    rows.forEach(r=>setDimDone(r.iid,false));
    renderMarkTab(markType);
  });
}


// ===================== THEME SYSTEM =====================

const DAMAGE_ACCENTS = {
  1: { accent:'#b8b8c0', accent2:'#d0d0d8', glow:'rgba(184,184,192,0.12)', line:'rgba(184,184,192,0.06)', name:'Kinetic' },
  2: { accent:'#79c2f4', accent2:'#a0d8ff', glow:'rgba(121,194,244,0.14)', line:'rgba(121,194,244,0.06)', name:'Arc' },
  3: { accent:'#f07833', accent2:'#ffa060', glow:'rgba(240,120,51,0.14)',  line:'rgba(240,120,51,0.06)',  name:'Solar' },
  4: { accent:'#9966cc', accent2:'#b888e8', glow:'rgba(153,102,204,0.14)', line:'rgba(153,102,204,0.06)', name:'Void' },
  6: { accent:'#4d97c4', accent2:'#80c0e0', glow:'rgba(77,151,196,0.14)',  line:'rgba(77,151,196,0.06)',  name:'Stasis' },
  7: { accent:'#4fce96', accent2:'#80e8b8', glow:'rgba(79,206,150,0.14)',  line:'rgba(79,206,150,0.06)',  name:'Strand' },
};

let currentTheme  = localStorage.getItem('d2theme')  || 'destiny';
let currentAccent = localStorage.getItem('d2accent') || 'auto';
let starAnimId = null;

function applyTheme(theme, accent) {
  currentTheme  = theme;
  currentAccent = accent;
  localStorage.setItem('d2theme',  theme);
  localStorage.setItem('d2accent', accent);

  const root = document.documentElement;
  const canvas = document.getElementById('starCanvas');

  // Stop starfield if switching away
  if (theme !== 'starfield') {
    if (canvas) canvas.style.opacity = '0';
    if (starAnimId) { cancelAnimationFrame(starAnimId); starAnimId = null; }
  }

  // Toggle destiny hex overlay
  document.body.classList.toggle('theme-destiny', theme === 'destiny');

  // ── Main theme ──
  if (theme === 'starfield') {
    root.style.setProperty('--theme-glow', 'rgba(0,0,0,0)');
    root.style.setProperty('--theme-line', 'rgba(0,0,0,0)');
    startStarfield();
  } else if (theme.startsWith('class-')) {
    const classType = Number(theme.split('-')[1]);
    const t = CLASS_THEMES[classType] || CLASS_THEMES[0];
    root.style.setProperty('--theme-glow', t.glow);
    root.style.setProperty('--theme-line', t.line);
    // Class theme also drives accent unless user has explicitly picked a damage accent
    if (accent === 'auto') {
      root.style.setProperty('--accent',  t.accent);
      root.style.setProperty('--accent2', t.accent2);
    }
  } else if (theme === 'class') {
    // legacy fallback — use last played class
    const classType = window._lastCharClass ?? 0;
    const t = CLASS_THEMES[classType] || CLASS_THEMES[0];
    root.style.setProperty('--theme-glow', t.glow);
    root.style.setProperty('--theme-line', t.line);
    if (accent === 'auto') {
      root.style.setProperty('--accent',  t.accent);
      root.style.setProperty('--accent2', t.accent2);
    }
  } else if (theme === 'destiny') {
    root.style.setProperty('--theme-glow', 'rgba(200,168,75,0.10)');
    root.style.setProperty('--theme-line', 'rgba(200,168,75,0.05)');
  }

  // ── Accent ──
  let accentData = null;
  const isClassTheme = theme.startsWith('class-') || theme === 'class';
  if (accent === 'auto' && !isClassTheme) {
    // Find most-used damage type in inventory
    const counts = {};
    allItems.filter(i=>WEAPON_BUCKETS.has(getEffectiveBucketHash(i))).forEach(i=>{
      const dt = getItemDef(i.itemHash)?.defaultDamageType;
      if (dt && dt > 0) counts[dt] = (counts[dt]||0) + 1;
    });
    const topDt = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
    accentData = DAMAGE_ACCENTS[topDt] || null;
  } else if (accent !== 'auto') {
    accentData = DAMAGE_ACCENTS[Number(accent)] || null;
  }

  if (accentData) {
    root.style.setProperty('--accent',  accentData.accent);
    root.style.setProperty('--accent2', accentData.accent2);
    if (theme !== 'starfield' && theme !== 'destiny' && !isClassTheme) {
      root.style.setProperty('--theme-glow', accentData.glow);
      root.style.setProperty('--theme-line', accentData.line);
    }
  } else if (accent === 'auto' && !profileLoaded && !isClassTheme) {
    // Default accent = gold until profile loads
    root.style.setProperty('--accent',  '#c8a84b');
    root.style.setProperty('--accent2', '#e8c96a');
  }

  updateThemePickerUI();
}

function startStarfield() {
  const canvas = document.getElementById('starCanvas');
  if (!canvas) return;
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.opacity = '1';
  const ctx = canvas.getContext('2d');
  const stars = Array.from({length: 200}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.2,
    speed: Math.random() * 0.12 + 0.03,
    opacity: Math.random() * 0.7 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
  }));

  function draw() {
    if (currentTheme !== 'starfield') return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.twinkle += s.twinkleSpeed;
      s.y += s.speed;
      if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      const alpha = s.opacity * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    });
    starAnimId = requestAnimationFrame(draw);
  }
  if (starAnimId) cancelAnimationFrame(starAnimId);
  draw();

  window.addEventListener('resize', () => {
    if (currentTheme !== 'starfield') return;
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars.forEach(s => { s.x = Math.random() * canvas.width; s.y = Math.random() * canvas.height; });
  });
}

function updateThemePickerUI() {
  // Update theme swatch active states — handles class-0/1/2
  document.querySelectorAll('.theme-swatch').forEach(el => {
    const active = el.dataset.theme === currentTheme;
    el.style.border = active ? `2px solid var(--accent)` : '2px solid transparent';
    el.style.boxShadow = active ? '0 0 8px var(--accent)' : 'none';
  });

  document.querySelectorAll('.accent-swatch').forEach(el => {
    const active = el.dataset.accent === currentAccent;
    el.style.border = active ? `2px solid var(--accent)` : '2px solid rgba(255,255,255,0.2)';
    el.style.boxShadow = active ? '0 0 6px var(--accent)' : 'none';
    el.style.transform = active ? 'scale(1.15)' : 'scale(1)';
  });

  // Draw starfield swatch preview
  const swatchCanvas = document.querySelector('.theme-swatch[data-theme="starfield"] .swatch-canvas');
  if (swatchCanvas) {
    const sc = swatchCanvas.getContext('2d');
    sc.fillStyle = '#0a0c0f';
    sc.fillRect(0, 0, 58, 44);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * 58, y = Math.random() * 44;
      const r = Math.random() * 1.2 + 0.2;
      sc.beginPath();
      sc.arc(x, y, r, 0, Math.PI*2);
      sc.fillStyle = `rgba(255,255,255,${Math.random()*0.8+0.2})`;
      sc.fill();
    }
  }
}

function toggleThemePanel() {
  const panel = document.getElementById('themePicker');
  const arrow = document.getElementById('themeArrow');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
  if (!isOpen) updateThemePickerUI();
}

function initThemePicker() {
  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.addEventListener('click', () => applyTheme(el.dataset.theme, currentAccent));
  });
  document.querySelectorAll('.accent-swatch').forEach(el => {
    el.addEventListener('click', () => applyTheme(currentTheme, el.dataset.accent));
  });
  // Draw static swatch previews on init
  updateThemePickerUI();
}

// ===================== INIT =====================
(async function init() {
  buildDamageIconMap();
  updateOAuthStatus();
  initThemePicker();
  applyTheme(currentTheme, currentAccent);
  // Handle OAuth callback redirect - auto-load profile after login
  if (window.location.search.includes('code=')) {
    const ok = await handleOAuthCallback();
    if (ok) searchPlayer();
  } else if (isOAuthValid()) {
    // Already logged in - auto-load guardian
    searchPlayer();
  } else {
    // Try token refresh
    const refreshed = await refreshOAuthToken();
    if (refreshed) { updateOAuthStatus(); searchPlayer(); }
  }
})();

// ===================== KEYBOARD =====================
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeCompare(); });
document.getElementById('compareOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeCompare(); });
</script>
