                  const pd = getItemDef(h);
                  const pname = pd?.displayProperties?.name||'';
                  const isEquipped = h===col.equippedHash;
                  return `<div style="padding:3px 0;background:${isEquipped?'rgba(200,168,75,0.08)':'transparent'};border-left:${isEquipped?'2px solid var(--accent)':'2px solid transparent'};padding-left:5px;margin-bottom:2px;">
                    <span style="font-size:${isEquipped?12:11}px;color:${isEquipped?'var(--accent)':'var(--text)'};font-weight:${isEquipped?600:400};line-height:1.4;display:block;">${pname}</span>
                  </div>`;
                }).join('')}
              </div>`).join('')}
          </div>
        </div>`;
      }
    }

    // ---- STATS ----
    let statsHtml = '';
    if (type==='weapon' && showWeaponStats && stats?.stats) {
      const entries = WEAPON_STAT_HASHES
        .map(h=>({hash:h,name:WEAPON_STAT_NAMES[h],val:stats.stats[h]?.value}))
        .filter(s=>s.val!==undefined&&s.val>0);
      if (entries.length) {
        statsHtml = `<div class="stats-section" style="margin-top:8px;">
          <div class="perks-label">Base Stats</div>
          ${entries.map(s=>`<div class="stat-row">
            <div class="stat-row-label">${s.name}</div>
            <div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${Math.min(s.val,100)}%"></div></div>
            <div class="stat-row-val">${s.val}</div>
          </div>`).join('')}
        </div>`;
      }
    } else if (type==='armor') {
      const maxPerStat = {};
      items.forEach(({item:it,stats:st})=>{
        ARMOR_STAT_HASHES.forEach(h=>{
          const v = showBaseStats ? getBaseStat(it,h) : (st?.stats?.[h]?.value||0);
          if (!maxPerStat[h]||v>maxPerStat[h]) maxPerStat[h]=v;
        });
      });
      const entries = ARMOR_STAT_HASHES.map(h=>{
        const val = showBaseStats ? getBaseStat(item,h) : (stats?.stats?.[h]?.value||0);
        return {hash:h, name:ARMOR_STAT_NAMES[h], val};
      }).filter(s=>s.val>0);
      const total = showBaseStats ? getBaseStatTotal(item) : entries.reduce((a,s)=>a+s.val,0);
      if (entries.length) {
        statsHtml = `<div class="stats-section">
          <div class="perks-label">Stats${showBaseStats?' <span style="font-size:10px;color:var(--text-dim)">(base)</span>':''} <span style="color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;margin-left:8px;">Total: ${total}</span></div>
          ${entries.map(s=>{
            const isBest = maxPerStat[s.hash]===s.val && items.length>1 && s.val>0;
            return `<div class="stat-row">
              <div class="stat-row-label" style="${isBest?'color:var(--fav);':''}">${s.name}${isBest?' ★':''}</div>
              <div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${Math.min(s.val,100)}%;${isBest?'background:var(--fav);':''}"></div></div>
              <div class="stat-row-val" style="${isBest?'color:var(--fav);':''}">${s.val}</div>
            </div>`;
          }).join('')}
        </div>`;
      }
    }

    return `<div class="compare-item" id="citem-${iid}">
      <div class="compare-item-header" style="display:flex;align-items:flex-start;gap:12px;">
        <div class="compare-item-icon" style="${isMasterworked(iid)?'outline:2px solid var(--exotic-col);outline-offset:-2px;':''}">${icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="compare-item-name">${name}</div>
          <div class="compare-item-meta">${damageIcon(def)} ${def?.itemTypeAndTierDisplayName||''} <span class="loc-badge">${loc}${item.equipped?' · Equipped':''}</span></div>
          <div class="compare-item-power">${power}</div>
        </div>
        <div class="mark-row" data-iid="${iid}" data-type="${type}" style="flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
          <div style="display:flex;gap:3px;">
            <button class="mark-btn fav ${getLockBtnClass(iid)}" data-mark="fav" style="padding:4px 8px;font-size:11px;" title="${getLockBtnTitle(iid)}">🔒 Lock</button>
            <button class="mark-btn junk ${mark==='junk'?'active':''}" data-mark="junk" style="padding:4px 8px;font-size:11px;">Junk</button>
            <button class="mark-btn infuse ${mark==='infuse'?'active':''}" data-mark="infuse" style="padding:4px 8px;font-size:11px;">Infuse</button>
            <button class="mark-btn clear-btn" data-mark="clear" style="padding:4px 8px;font-size:11px;">✕</button>
          </div>
        </div>
      </div>
      ${perksHtml}
      ${statsHtml}
    </div>`;
  }).join('');

  document.getElementById('compareContent').innerHTML = `
    <div class="compare-title">${name0} — ${items.length > 1 ? items.length + ' copies' : 'Item Detail'}</div>
    ${controlsHtml}
    <div class="compare-grid" style="${gridStyle}">${itemsHtml}</div>`;

  // Armor sort selects
  document.querySelectorAll('#compareContent .armor-sort-sel').forEach(sel=>{

}

function setMark(instanceId, mark, type, instanceIds) {
  saveMark(instanceId, mark);
  if (type!=='weapon') renderCompare(instanceIds, type);
  if (type==='weapon' && activeWeaponBHash && activeWeaponType) {
    selectWeaponType(activeWeaponBHash, activeWeaponType);
  } else if (type==='armor' && activeArmorClass!==null && activeArmorSlot) {
    selectArmorSlot(activeArmorClass, activeArmorSlot);
  }
}

function resortCompare(sort, instanceIds, type) {
  compareSort = sort;
  renderCompare(instanceIds, type);
}

// ===================== FAVORITES & JUNK TABS =====================

function getDimDone(iid) { return !!JSON.parse(localStorage.getItem('d2dim')||'{}')[iid]; }
function setDimDone(iid, val) {
  const d = JSON.parse(localStorage.getItem('d2dim')||'{}');
  if (val) d[iid]=1; else delete d[iid];
  localStorage.setItem('d2dim', JSON.stringify(d));
}

const openNameAccordions = {junk:{}, fav:{}};
const markTabSort = {junk:{col:'power',dir:-1}, fav:{col:'power',dir:-1}};

function buildMarkRows(markType) {
  return allItems
    .filter(i=>{
      if (getMark(i.itemInstanceId)!==markType || !i.itemInstanceId) return false;
      const b = getEffectiveBucketHash(i);
      return WEAPON_BUCKETS.has(b) || ARMOR_BUCKETS.has(b);
    })
    .map(item=>{
      const def   = getItemDef(item.itemHash);
      const inst  = instanceData[item.itemInstanceId];
      const socks = socketData[item.itemInstanceId];
      const stats = statsData[item.itemInstanceId];
      const name  = def?.displayProperties?.name||'Unknown';
      const typeLabel = def?.itemTypeDisplayName||'';
      const tier  = def?.inventory?.tierType||0;
      const rk    = RARITY[tier]||'common';
      const power = inst?.primaryStat?.value||0;
      const effectiveBucket = getEffectiveBucketHash(item);
      const isWeapon = WEAPON_BUCKETS.has(effectiveBucket);
      const isArmor  = ARMOR_BUCKETS.has(effectiveBucket);
      const category = isWeapon?'Weapon':isArmor?'Armor':'Other';
      const slotName = isWeapon
        ? (WEAPON_BUCKET_NAMES[effectiveBucket]||'Weapon')
        : (ARMOR_BUCKET_NAMES[effectiveBucket]||'Armor');
      const icon = def?.displayProperties?.hasIcon ? def.displayProperties.icon : null;
      const perks = [];
      if (socks?.sockets) {
        socks.sockets.forEach(s=>{
          if (!s.plugHash) return;
          const pd = getItemDef(s.plugHash);
          if (!pd) return;
          const plug = pd.plug?.plugCategoryIdentifier||'';
          if (plug.includes('traits')||plug.includes('perks')||plug.includes('frames')||plug.includes('intrinsics'))
            perks.push({name:pd.displayProperties?.name, icon:pd.displayProperties?.hasIcon?pd.displayProperties.icon:null});
        });
      }
      const armorStats = {};
      if (stats?.stats) ARMOR_STAT_HASHES.forEach(h=>{ if(stats.stats[h]?.value) armorStats[h]=stats.stats[h].value; });
      return {item, name, typeLabel, tier, rk, power, category, slotName, icon, perks, armorStats,
              iid:item.itemInstanceId, loc:item.loc||'', equipped:item.equipped||false};
    });
}

function renderMarkTab(markType) {
  clearHoverTimer(); // clear any stale tooltip when re-rendering
  const panelId = markType==='junk'?'panel-junk':'panel-favorites';
  const panel   = document.getElementById(panelId);
  const emptyLabel = markType==='junk'?'No items marked as junk yet.':'No items marked as locked yet.';
  const accentColor = markType==='junk'?'var(--junk)':'var(--fav)';

  const rows = buildMarkRows(markType);
  if (!rows.length) {
    panel.innerHTML=`<div class="no-junk">${emptyLabel}<br><span style="font-size:12px;color:var(--text-dim);margin-top:6px;display:block;">Mark items in the Weapons or Armor tabs.</span></div>`;
    return;
  }

  const sort = markTabSort[markType] || {col:'power', dir:-1};

  function sortRows(arr) {
    return [...arr].sort((a,b)=>{
      const da=getDimDone(a.iid)?1:0, db=getDimDone(b.iid)?1:0;
      if (da!==db) return da-db;
      if (sort.col==='power') return (b.power-a.power)*sort.dir;
      if (sort.col==='name') return a.name.localeCompare(b.name)*sort.dir;
      if (sort.col==='loc') return a.loc.localeCompare(b.loc)*sort.dir;
      const h = Number(sort.col);
      return ((b.armorStats[h]||0)-(a.armorStats[h]||0))*sort.dir;
    });
  }

  function thHtml(col, label, category) {
    const active = sort.col===col;
    const arrow  = active?(sort.dir===1?'\u2191':'\u2193'):'';
    return `<th class="${active?'sorted':''}" data-col="${col}" data-tab="${markType}" data-cat="${category||''}">${label}<span class="sort-arrow">${arrow}</span></th>`;
  }

  function markBtns(r) {
    const m = getMark(r.iid);
    return `<div style="display:flex;align-items:center;gap:3px;">
      <button class="mark-btn fav ${getLockBtnClass(r.iid)}" data-iid="${r.iid}" data-mark="fav" data-tab="${markType}" data-pending="" title="${getLockBtnTitle(r.iid)}" style="padding:4px 10px;font-size:13px;">🔒</button>
      <button class="mark-btn junk ${m==='junk'?'active':''}" data-iid="${r.iid}" data-mark="junk" data-tab="${markType}" data-pending="" style="padding:4px 10px;font-size:12px;">Junk</button>
      <button class="mark-btn infuse ${m==='infuse'?'active':''}" data-iid="${r.iid}" data-mark="infuse" data-tab="${markType}" data-pending="" style="padding:4px 10px;font-size:13px;">&#9889;</button>
      <button class="mark-btn clear-btn" data-iid="${r.iid}" data-mark="clear" data-tab="${markType}" data-pending="" style="padding:4px 10px;font-size:13px;">&#215;</button>
      <button class="confirm-mark-btn" data-iid="${r.iid}" data-tab="${markType}" style="display:none;background:var(--fav);color:#0a0c0f;border:none;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;cursor:pointer;">OK</button>
    </div>`;
  }

  function rowHtml(r) {
    const done = getDimDone(r.iid);
    const armorCells = r.category==='Armor'
      ? ARMOR_STAT_HASHES.map(h=>`<td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:${r.armorStats[h]?'var(--text)':'var(--text-dim)'};">${r.armorStats[h]||'&#8212;'}</td>`).join('')
      : '';
    return `<tr class="${done?'done-in-dim':''}" data-iid="${r.iid}" onmouseenter="startHoverTimer(event,'${r.iid}')" onmouseleave="clearHoverTimer()">
      <td class="dim-check-cell"><input type="checkbox" class="dim-checkbox" ${done?'checked':''} data-iid="${r.iid}" data-tab="${markType}" /></td>
      <td><div class="junk-name-cell">
        <div class="rarity-dot ${r.rk}"></div>
        <div class="junk-icon" style="${isMasterworked(r.iid)?'outline:2px solid var(--exotic-col);outline-offset:-2px;':''}">${r.icon?`<img src="https://www.bungie.net${r.icon}" />`:'?'}
          ${tierPipsSvg(gearTierOf(r.iid),'sm')}
          ${iconBottomBar(getItemDef(r.item.itemHash), r.power, r.category==='Weapon'&&isCrafted(r.iid), 'sm')}
        </div>
        <div><div class="junk-item-name">${r.name}</div><div class="junk-item-sub">${r.typeLabel}</div></div>
      </div></td>
      <td class="power-cell">${r.power||'&#8212;'}</td>
      <td class="loc-cell">${r.loc}${r.equipped?'<span class="equipped-tag">Equipped</span>':''}</td>
      <td><div class="perks-cell">${r.perks.slice(0,3).map(p=>`<div class="perk-mini">${p.icon?`<img src="https://www.bungie.net${p.icon}" />`:''}
        <span>${p.name||''}</span></div>`).join('')}</div></td>
      ${armorCells}
      <td><div style="display:flex;gap:3px;">${markBtns(r)}</div></td>
    </tr>`;
  }

  // Build slot map grouped by category then slot
  const WEAPON_SLOT_ORDER = ['Kinetic','Energy','Heavy'];
  const ARMOR_SLOT_ORDER  = ['Helmet','Gauntlets','Chest','Legs','Class Item'];

  function buildCategoryHtml(category, slotOrder) {
    const catRows = rows.filter(r=>r.category===category);
    if (!catRows.length) return '';

    const slotMap = {};
    catRows.forEach(r=>{
      if (!slotMap[r.slotName]) slotMap[r.slotName]={names:{}, rows:[]};
      if (!slotMap[r.slotName].names[r.name]) slotMap[r.slotName].names[r.name]=[];
      slotMap[r.slotName].names[r.name].push(r);
      slotMap[r.slotName].rows.push(r);
    });

    const orderedSlots = slotOrder.filter(s=>slotMap[s])
      .concat(Object.keys(slotMap).filter(s=>!slotOrder.includes(s)));

    function tableHtml(rowsArr) {
      const armorStatHeaders = category==='Armor'
        ? ARMOR_STAT_HASHES.map(h=>thHtml(String(h), ARMOR_STAT_NAMES[h], category)).join('')
        : '';
      const sorted = sortRows(rowsArr);
      return `<table class="junk-table">
        <thead><tr>
          <th style="width:32px;"></th>
          ${thHtml('name','Item',category)}
          ${thHtml('power','Power',category)}
          ${thHtml('loc','Location',category)}
          <th>Perks</th>
          ${armorStatHeaders}
          <th>Mark</th>
        </tr></thead>
        <tbody>${sorted.map(rowHtml).join('')}</tbody>
      </table>`;
    }

    const slotsHtml = orderedSlots.map(slotName=>{
      const slot = slotMap[slotName];
      const totalItems = slot.rows.length;
      const accordionKey = `${markType}:${category}:${slotName}`;

      let bodyHtml;
      if (markType==='junk') {
        // Trash tab — flat, sortable table per slot, no per-name sub-grouping
        bodyHtml = tableHtml(slot.rows);
      } else {
        bodyHtml = Object.entries(slot.names).map(([name, nameRows])=>{
          const def = getItemDef(nameRows[0].item.itemHash);
          const icon = def?.displayProperties?.hasIcon?def.displayProperties.icon:null;
          const nameKey = `${accordionKey}:${name}`;
          const isOpen = (openNameAccordions[markType]||{})[nameKey];
          const doneCount = nameRows.filter(r=>getDimDone(r.iid)).length;
          const rk = nameRows[0].rk;
          return `<div class="name-accordion">
            <div class="name-accordion-header ${isOpen?'open':''}" data-rawkey="${encodeURIComponent(nameKey)}" data-tab="${markType}">
              <div class="rarity-bar rarity-${rk}" style="width:3px;align-self:stretch;flex-shrink:0;margin-right:4px;"></div>
              <div class="name-acc-icon">${icon?`<img src="https://www.bungie.net${icon}" />`:'?'}</div>
              <span class="name-acc-title">${name}</span>
              <span class="name-acc-count">${nameRows.length} item${nameRows.length>1?'s':''} ${doneCount>0?'&#183; <span style="color:var(--accent)">'+doneCount+' done</span>':''}</span>
              <span class="name-acc-arrow">&#9660;</span>
            </div>
            <div class="name-accordion-body ${isOpen?'open':''}">
              ${tableHtml(nameRows)}
            </div>
          </div>`;
        }).join('');
      }

      // Slot sub-accordion — collapsed by default (undefined = closed)
      const isSlotOpen = (openNameAccordions[markType]||{})[accordionKey] === true;
      return `<div class="accordion" style="margin-bottom:4px;">
        <div class="accordion-header ${isSlotOpen?'open':''}" data-rawkey="${encodeURIComponent(accordionKey)}" data-tab="${markType}" data-slot-acc="1">
          <span class="accordion-title">${slotName}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="accordion-count">${totalItems} items</span>
            <span class="accordion-arrow">▼</span>
          </span>
        </div>
        <div class="accordion-body ${isSlotOpen?'open':''}">${bodyHtml}</div>
      </div>`;
    }).join('');

    // Category = plain section header, not collapsible
    return `<div style="margin-bottom:16px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);padding:10px 0 8px;border-bottom:2px solid var(--accent);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
        <span>${category}s</span>
        <span style="font-size:11px;font-weight:400;color:var(--text-dim);letter-spacing:.04em;">${catRows.length} items</span>
      </div>
      ${slotsHtml}
    </div>`;
  }

  const weaponsHtml = buildCategoryHtml('Weapon', WEAPON_SLOT_ORDER);
  const armorHtml   = buildCategoryHtml('Armor',  ARMOR_SLOT_ORDER);

  const doneCount = rows.filter(r=>getDimDone(r.iid)).length;
  const pendingCount = markType==='fav' ? rows.filter(r=>{
    const appLocked = getMark(r.iid)==='fav';
    const gameLocked = inGameLockState[r.iid]||false;
    return appLocked !== gameLocked;
  }).length : 0;
  const syncBtn = markType==='fav' ? `<button id="syncLocksBtn" onclick="syncLocksToGame()"
    style="background:${pendingCount?'var(--accent)':'var(--surface2)'};color:${pendingCount?'#0a0c0f':'var(--text-muted)'};border:1px solid ${pendingCount?'var(--accent)':'var(--border2)'};font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;cursor:pointer;">
    ${pendingCount?`Sync to Game (${pendingCount} pending)`:'Sync to Game'}
  </button>` : '';

  panel.innerHTML = `
    <div class="mark-controls">
      <span style="font-size:13px;color:var(--text-muted);">${rows.length} items &#183; <span style="color:${accentColor}">${doneCount} done in DIC</span></span>
      ${syncBtn}
      <button class="unmark-btn" id="clearDimBtn" data-tab="${markType}" style="margin-left:auto;">Clear all DIC checks</button>
    </div>
    ${weaponsHtml}${armorHtml}`;

  // Slot accordion toggles
  panel.querySelectorAll('.accordion-header[data-slot-acc]').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const rawKey = decodeURIComponent(hdr.dataset.rawkey);
      const tab = hdr.dataset.tab;
      if (!openNameAccordions[tab]) openNameAccordions[tab]={};
      openNameAccordions[tab][rawKey] = !openNameAccordions[tab][rawKey];
      renderMarkTab(tab);
    });
  });

  // Name-level accordion toggles
  panel.querySelectorAll('.name-accordion-header').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const rawKey = decodeURIComponent(hdr.dataset.rawkey);
      const tab = hdr.dataset.tab;
      if (!openNameAccordions[tab]) openNameAccordions[tab]={};
      openNameAccordions[tab][rawKey] = !openNameAccordions[tab][rawKey];
      renderMarkTab(tab);
    });
  });

  // Sort by column header click
  panel.querySelectorAll('.junk-table th[data-col]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const tab = th.dataset.tab;
      const col = th.dataset.col;
      const s = markTabSort[tab] || (markTabSort[tab]={col:'power',dir:-1});
      if (s.col===col) s.dir*=-1; else { s.col=col; s.dir=-1; }
      renderMarkTab(tab);
    });
  });

  panel.querySelectorAll('.dim-checkbox').forEach(cb=>{
    cb.addEventListener('change', ()=>{ setDimDone(cb.dataset.iid, cb.checked); renderMarkTab(cb.dataset.tab); });
  });

  panel.querySelectorAll('.mark-btn[data-iid]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const iid = btn.dataset.iid;
      const tab = btn.dataset.tab;
      const newMark = btn.dataset.mark==='clear'?null:btn.dataset.mark;
      const row = btn.closest('tr');
      if (row) {
        row.querySelectorAll('.mark-btn[data-iid]').forEach(b=>b.classList.remove('pending-select'));
        btn.classList.add('pending-select');
        btn.dataset.pending = newMark===null?'clear':newMark;
        const confirmBtn = row.querySelector('.confirm-mark-btn');
        if (confirmBtn) confirmBtn.style.display='block';
      }
    });
  });

  panel.querySelectorAll('.confirm-mark-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const iid = btn.dataset.iid;
      const tab = btn.dataset.tab;
      const row = btn.closest('tr');
      const pendingBtn = row?.querySelector('.mark-btn.pending-select');
      if (!pendingBtn) return;
      const m = pendingBtn.dataset.pending;
      saveMark(iid, m==='clear'?null:m);
      renderMarkTab(tab);
    });
  });

  panel.querySelector('#clearDimBtn')?.addEventListener('click', ()=>{
    rows.forEach(r=>setDimDone(r.iid,false));
    renderMarkTab(markType);
  });
}


// ===================== THEME SYSTEM =====================

const DAMAGE_ACCENTS = {
  1: { accent:'#b8b8c0', accent2:'#d0d0d8', glow:'rgba(184,184,192,0.12)', line:'rgba(184,184,192,0.06)', name:'Kinetic' },
  2: { accent:'#79c2f4', accent2:'#a0d8ff', glow:'rgba(121,194,244,0.14)', line:'rgba(121,194,244,0.06)', name:'Arc' },
  3: { accent:'#f07833', accent2:'#ffa060', glow:'rgba(240,120,51,0.14)',  line:'rgba(240,120,51,0.06)',  name:'Solar' },
  4: { accent:'#9966cc', accent2:'#b888e8', glow:'rgba(153,102,204,0.14)', line:'rgba(153,102,204,0.06)', name:'Void' },
  6: { accent:'#4d97c4', accent2:'#80c0e0', glow:'rgba(77,151,196,0.14)',  line:'rgba(77,151,196,0.06)',  name:'Stasis' },
  7: { accent:'#4fce96', accent2:'#80e8b8', glow:'rgba(79,206,150,0.14)',  line:'rgba(79,206,150,0.06)',  name:'Strand' },
};

let currentTheme      = localStorage.getItem('d2theme')      || 'destiny';
let currentAccent     = localStorage.getItem('d2accent')     || 'auto';
let currentBrightness = Number(localStorage.getItem('d2brightness') || 5);
let starAnimId = null;

function applyTheme(theme, accent, brightness) {
  if (brightness !== undefined) currentBrightness = brightness;
  const bMult = currentBrightness / 5; // 1.0 at default, 0.2 at min, 2.0 at max
  localStorage.setItem('d2brightness', currentBrightness);
  currentTheme  = theme;
  currentAccent = accent;
  localStorage.setItem('d2theme',  theme);
  localStorage.setItem('d2accent', accent);

  const root = document.documentElement;
  const canvas = document.getElementById('starCanvas');

  // Stop starfield if switching away
  if (theme !== 'starfield') {
    if (canvas) canvas.style.opacity = '0';
    if (starAnimId) { cancelAnimationFrame(starAnimId); starAnimId = null; }
  }

  // Toggle destiny hex overlay
  document.body.classList.toggle('theme-destiny', theme === 'destiny');

  // ── Main theme ──
  if (theme === 'starfield') {
    root.style.setProperty('--theme-glow', 'rgba(0,0,0,0)');
    root.style.setProperty('--theme-line', 'rgba(0,0,0,0)');
    startStarfield();
  } else if (theme.startsWith('class-')) {
    const classType = Number(theme.split('-')[1]);
    const t = CLASS_THEMES[classType] || CLASS_THEMES[0];
    root.style.setProperty('--theme-glow', `rgba(${t.glow.match(/\d+,\d+,\d+/)[0]},${parseFloat(t.glow.match(/[\d.]+\)$/)[0])*bMult})`);
    root.style.setProperty('--theme-line', `rgba(${t.line.match(/\d+,\d+,\d+/)[0]},${parseFloat(t.line.match(/[\d.]+\)$/)[0])*bMult})`);
  } else if (theme === 'class') {
    const classType = window._lastCharClass ?? 0;
    const t = CLASS_THEMES[classType] || CLASS_THEMES[0];
    root.style.setProperty('--theme-glow', `rgba(${t.glow.match(/\d+,\d+,\d+/)[0]},${parseFloat(t.glow.match(/[\d.]+\)$/)[0])*bMult})`);
    root.style.setProperty('--theme-line', `rgba(${t.line.match(/\d+,\d+,\d+/)[0]},${parseFloat(t.line.match(/[\d.]+\)$/)[0])*bMult})`);
  } else if (theme === 'destiny') {
    root.style.setProperty('--theme-glow', `rgba(200,168,75,${0.35*bMult})`);
    root.style.setProperty('--theme-line', `rgba(200,168,75,${0.16*bMult})`);
  }

  // ── Accent ──
  let accentData = null;
  const isClassTheme = theme.startsWith('class-') || theme === 'class';
  if (accent === 'auto') {
    // Find most-used damage type in inventory
    const counts = {};
    allItems.filter(i=>WEAPON_BUCKETS.has(getEffectiveBucketHash(i))).forEach(i=>{
      const dt = getItemDef(i.itemHash)?.defaultDamageType;
      if (dt && dt > 0) counts[dt] = (counts[dt]||0) + 1;
    });
    const topDt = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
    accentData = DAMAGE_ACCENTS[topDt] || null;
  } else {
    accentData = DAMAGE_ACCENTS[Number(accent)] || null;
  }

  if (accentData) {
    // Accent only controls UI colors (--accent, --accent2), never the background theme
    root.style.setProperty('--accent',  accentData.accent);
    root.style.setProperty('--accent2', accentData.accent2);
  } else if (accent === 'auto' && !profileLoaded) {
    root.style.setProperty('--accent',  '#c8a84b');
    root.style.setProperty('--accent2', '#e8c96a');
  }

  updateThemePickerUI();
}

function startStarfield() {
  const canvas = document.getElementById('starCanvas');
  if (!canvas) return;
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.opacity = '1';
  const ctx = canvas.getContext('2d');
  const stars = Array.from({length: 200}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.2,
    speed: Math.random() * 0.12 + 0.03,
    opacity: Math.random() * 0.7 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
  }));

  function draw() {
    if (currentTheme !== 'starfield') return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.twinkle += s.twinkleSpeed;
      s.y += s.speed;
      if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      const alpha = s.opacity * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    });
    starAnimId = requestAnimationFrame(draw);
  }
  if (starAnimId) cancelAnimationFrame(starAnimId);
  draw();

  window.addEventListener('resize', () => {
    if (currentTheme !== 'starfield') return;
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars.forEach(s => { s.x = Math.random() * canvas.width; s.y = Math.random() * canvas.height; });
  });
}

function updateThemePickerUI() {
  const brightnessEl = document.getElementById('themeBrightness');
  if (brightnessEl) brightnessEl.value = currentBrightness;
  // Update theme swatch active states — handles class-0/1/2
  document.querySelectorAll('.theme-swatch').forEach(el => {
    const active = el.dataset.theme === currentTheme;
    el.style.border = active ? `2px solid var(--accent)` : '2px solid transparent';
    el.style.boxShadow = active ? '0 0 8px var(--accent)' : 'none';
  });

  document.querySelectorAll('.accent-swatch').forEach(el => {
    const active = el.dataset.accent === currentAccent;
    el.style.border = active ? `2px solid var(--accent)` : '2px solid rgba(255,255,255,0.2)';
    el.style.boxShadow = active ? '0 0 6px var(--accent)' : 'none';
    el.style.transform = active ? 'scale(1.15)' : 'scale(1)';
  });

  // Draw starfield swatch preview
  const swatchCanvas = document.querySelector('.theme-swatch[data-theme="starfield"] .swatch-canvas');
  if (swatchCanvas) {
    const sc = swatchCanvas.getContext('2d');
    sc.fillStyle = '#0a0c0f';
    sc.fillRect(0, 0, 58, 44);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * 58, y = Math.random() * 44;
      const r = Math.random() * 1.2 + 0.2;
      sc.beginPath();
      sc.arc(x, y, r, 0, Math.PI*2);
      sc.fillStyle = `rgba(255,255,255,${Math.random()*0.8+0.2})`;
      sc.fill();
    }
  }
}

function toggleThemePanel() {
  const panel = document.getElementById('themePicker');
  const arrow = document.getElementById('themeArrow');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
  if (!isOpen) updateThemePickerUI();
}

function initThemePicker() {
  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.addEventListener('click', () => applyTheme(el.dataset.theme, currentAccent));
  });
  document.querySelectorAll('.accent-swatch').forEach(el => {
    el.addEventListener('click', () => applyTheme(currentTheme, el.dataset.accent));
  });
  const brightnessEl = document.getElementById('themeBrightness');
  if (brightnessEl) {
    brightnessEl.value = currentBrightness;
    brightnessEl.addEventListener('input', () => applyTheme(currentTheme, currentAccent, Number(brightnessEl.value)));
  }
  updateThemePickerUI();
}

// ===================== DELETE MODE =====================
let trashModeCharId = null;
let trashModeDragItem = null;
let hoverTimer = null;
let hoverTooltip = null;

const SLOT_ORDER = [
  {name:'Kinetic',    bucket:1498876634, type:'weapon'},
  {name:'Energy',     bucket:2465295065, type:'weapon'},
  {name:'Heavy',      bucket:953998645,  type:'weapon'},
  {name:'Helmet',     bucket:3448274439, type:'armor'},
  {name:'Gauntlets',  bucket:3551918588, type:'armor'},
  {name:'Chest',      bucket:14239492,   type:'armor'},
  {name:'Legs',       bucket:20886954,   type:'armor'},
  {name:'Class Item', bucket:1585787867, type:'armor'},
];

function renderTrashMode() {
  clearHoverTimer(); // clear any stale tooltip when re-rendering
  const panel = document.getElementById('panel-trashmode');
  if (!panel) return;

  const characters = Object.values(allItems.reduce((acc,i)=>{
    if (i.characterId && i.characterId !== 'null') acc[i.characterId]=i.characterId;
    return acc;
  },{}));

  // Get characters from profileInfo
  const chars = profileInfo.characterIds || [];
  if (!chars.length) {
    panel.innerHTML = `<div class="no-junk">Load your guardian first.</div>`;
    return;
  }
  if (!trashModeCharId || !chars.includes(trashModeCharId)) trashModeCharId = chars[0];

  // Vault capacity
  const vaultItems = allItems.filter(i=>i.loc==='Vault' && (WEAPON_BUCKETS.has(getEffectiveBucketHash(i))||ARMOR_BUCKETS.has(getEffectiveBucketHash(i))));
  const vaultCount = vaultItems.length;
  const vaultMax = 1300;
  const vaultPct = Math.min(100, Math.round(vaultCount/vaultMax*100));
  const nearFull = vaultCount >= vaultMax - 10;
  const vaultColor = nearFull ? 'var(--junk)' : 'var(--fav)';

  // Character selector
  const charSelHtml = chars.map(cid=>{
    const classType = profileInfo.characterClasses?.[cid] ?? 0;
    const className = CLASS_NAMES[classType]||`Character`;
    const isActive = cid===trashModeCharId;
    return `<button onclick="selectTrashChar('${cid}')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;background:${isActive?'var(--accent)':'var(--surface)'};color:${isActive?'#0a0c0f':'var(--text-muted)'};border:1px solid ${isActive?'var(--accent)':'var(--border2)'};cursor:pointer;">${className}</button>`;
  }).join('');

  // Build slot rows
  const slotsHtml = SLOT_ORDER.map((slot, slotIdx)=>{
    // Left: character items for this slot
    const charItems = allItems.filter(i=>{
      if (i.characterId !== trashModeCharId) return false;
      return getEffectiveBucketHash(i) === slot.bucket;
    });
    // Right: junk items NOT on selected character (those show on left with red X)
    const junkItems = allItems.filter(i=>{
      if (getMark(i.itemInstanceId) !== 'junk') return false;
      if (i.characterId === trashModeCharId) return false; // already on this char, shows on left
      return getEffectiveBucketHash(i) === slot.bucket;
    });

    // renderIcon — uniform 48px, masterwork=gold border, red X for junk, always-visible transfer btn
    const renderIcon = (item, side) => {
      const def = getItemDef(item.itemHash);
      const icon = def?.displayProperties?.hasIcon ? `https://www.bungie.net${def.displayProperties.icon}` : '';
      const inst = instanceData[item.itemInstanceId];
      const power = inst?.primaryStat?.value||'';
      const isEquipped = item.equipped;
      const mw = isMasterworked(item.itemInstanceId);
      const isJunk = getMark(item.itemInstanceId) === 'junk';
      const isCraftedItem = isCrafted(item.itemInstanceId);
      const tier = gearTierOf(item.itemInstanceId);
      const border = mw ? '2px solid var(--exotic-col)' : '1px solid var(--border2)';
      const equippedBadge = isEquipped ? `<div style="position:absolute;top:1px;left:1px;font-family:'Barlow Condensed',sans-serif;font-size:7px;font-weight:700;background:var(--accent);color:#0a0c0f;padding:0 3px;line-height:1.4;z-index:2;">E</div>` : '';
      const junkOverlay = isJunk ? `<div style="position:absolute;left:0;top:0;width:48px;height:48px;pointer-events:none;z-index:2;" title="Marked as junk">
        <svg viewBox="0 0 48 48" width="48" height="48" style="position:absolute;left:0;top:0;filter:drop-shadow(0 0 1.5px rgba(0,0,0,0.95));">
          <circle cx="24" cy="23" r="9" fill="none" stroke="#3fe06a" stroke-width="3" stroke-linecap="round"/>
          <line x1="17.6" y1="29.4" x2="30.4" y2="16.6" stroke="#3fe06a" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>` : '';
      // Location only matters on the right (Trash) side — left side is obviously the selected character
      const locBadge = side==='junk' ? `<div style="position:absolute;top:1px;right:1px;line-height:0;z-index:2;" title="${item.loc}${item.inPostmaster?' · Postmaster':''}">${locBadgeSvg(item)}</div>` : '';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;">
        <div class="tm-icon"
          data-iid="${item.itemInstanceId}"
          data-side="${side}"
          data-slot="${slot.bucket}"
          draggable="true"
          style="position:relative;width:48px;height:48px;background:var(--surface2);border:${border};cursor:pointer;"
          onmouseenter="startHoverTimer(event,'${item.itemInstanceId}')"
          onmouseleave="clearHoverTimer()"
          ondragstart="onTMDragStart(event,'${item.itemInstanceId}','${side}','${slot.bucket}')"
          onclick="transferItem('${item.itemInstanceId}','${side}','${slot.bucket}')">
          ${icon?`<img src="${icon}" style="width:100%;height:100%;object-fit:cover;display:block;" />`:''}
          ${tierPipsSvg(tier,'lg')}
          ${equippedBadge}
          ${locBadge}
          ${junkOverlay}
          ${iconBottomBar(def, power, isCraftedItem, 'lg')}
        </div>
        <button style="width:48px;background:var(--surface);border:1px solid var(--border2);color:var(--text-muted);font-size:13px;padding:2px 0;cursor:pointer;line-height:1;"
          onclick="transferItem('${item.itemInstanceId}','${side}','${slot.bucket}')">⇄</button>
      </div>`;
    };

    // Left side: equipped alone, 3x3 inventory grid beside it, all same size
    const equippedItem = charItems.find(i=>i.equipped);
    const invItems = charItems.filter(i=>!i.equipped);
    const equippedHtml = equippedItem
      ? renderIcon(equippedItem,'char')
      : `<div style="width:48px;height:48px;background:var(--surface2);border:1px dashed var(--border2);opacity:0.4;flex-shrink:0;"></div>`;
    const invGridHtml = `<div style="display:grid;grid-template-columns:repeat(3,48px);gap:3px;">${
      Array.from({length:9}).map((_,idx)=> invItems[idx] ? renderIcon(invItems[idx],'char') : `<div style="width:48px;height:48px;background:var(--surface2);border:1px dashed var(--border);opacity:0.2;"></div>`).join('')
    }</div>`;

    // Right side: junk items grid
    const junkIcons = junkItems.map(i=>renderIcon(i,'junk')).join('');

    return `<div class="tm-slot-row" style="display:flex;gap:10px;margin-bottom:18px;align-items:flex-start;padding-top:16px;">
      <div class="tm-drop-zone" data-zone="char" data-slot="${slot.bucket}"
        style="position:relative;background:var(--surface);border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);padding:8px;display:flex;gap:8px;align-items:flex-start;transition:border-color .15s,background .15s;min-width:180px;">
        <div style="position:absolute;top:-14px;left:4px;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);">${slot.name}</div>
        ${equippedHtml}
        ${invGridHtml}
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:0;">

        <div class="tm-drop-zone" data-zone="junk" data-slot="${slot.bucket}"
          style="position:relative;min-height:60px;background:var(--surface);border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);padding:8px;display:flex;flex-wrap:wrap;gap:3px;transition:border-color .15s,background .15s;${slotIdx===0?'':'margin-top:0;'}">
          <div style="position:absolute;top:-14px;left:4px;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);opacity:0.7;">Trash</div>
          ${junkIcons||`<div style="color:var(--text-dim);font-size:11px;padding:4px;align-self:center;">No junk</div>`}
        </div>
      </div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div style="margin-top:16px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        ${charSelHtml}
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--surface);border:1px solid var(--border2);">
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);">Vault</span>
          <div style="width:120px;height:5px;background:var(--surface2);border-radius:3px;">
            <div style="height:5px;width:${vaultPct}%;background:${vaultColor};border-radius:3px;transition:width .3s;"></div>
          </div>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:${vaultColor};">${vaultCount} / ${vaultMax}${nearFull?' ⚠':''}</span>
        </div>
      </div>
      <div>${slotsHtml}</div>
    </div>`;



  // Wire drag/drop zones
  panel.querySelectorAll('.tm-drop-zone').forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.style.background='color-mix(in srgb, var(--accent) 15%, transparent)'; zone.style.borderColor='var(--accent)'; zone.style.boxShadow='inset 0 0 0 2px var(--accent)'; });
    zone.addEventListener('dragleave', ()=>{ zone.style.background=''; zone.style.borderColor=''; zone.style.boxShadow=''; });
    zone.addEventListener('drop', e=>{ e.preventDefault(); zone.style.background=''; zone.style.borderColor=''; zone.style.boxShadow=''; onTMDrop(e, zone.dataset.zone, Number(zone.dataset.slot)); });
  });
}

function selectTrashChar(cid) {
  trashModeCharId = cid;
  renderTrashMode();
}

function onTMDragStart(event, iid, side, slot) {
  trashModeDragItem = {iid, side, slot: Number(slot)};
  event.dataTransfer.effectAllowed = 'move';
}

function onTMDrop(event, zone, slotBucket) {
  if (!trashModeDragItem) return;
  const {iid, side} = trashModeDragItem;
  trashModeDragItem = null;
  if (side === zone) return; // dropped in same zone, no-op
  transferItem(iid, side, slotBucket);
}

async function transferItem(iid, side, slotBucket) {
  const item = allItems.find(i=>i.itemInstanceId===iid);
  if (!item) return;
  const def = getItemDef(item.itemHash);
  const isInVault = item.loc === 'Vault';
  const isOnChar = item.characterId === trashModeCharId;
  // Capture lock state BEFORE any transfer touches it — Bungie's API has a known bug
  // where items can pick up the locked status of other copies in the destination bucket.
  // We'll re-assert this value after landing on a character, same workaround DIM uses.
  const wasLocked = !!(item.state & 1);

  const {membershipType} = profileInfo;
  const headers = {'X-API-Key': BUNGIE_API_KEY, 'Authorization': `Bearer ${oauthToken}`, 'Content-Type': 'application/json'};

  // Postmaster items can't be vaulted or transferred directly — Bungie requires pulling
  // them into their owning character's regular inventory first via a separate endpoint.
  // Once pulled, the item behaves like a normal character-inventory item for the rest of
  // this function (vault-hop logic below already handles moving it on from there if needed).
  if (item.inPostmaster) {
    const pmResp = await fetch('https://www.bungie.net/Platform/Destiny2/Actions/Items/PullFromPostmaster/', {
      method:'POST', headers,
      body: JSON.stringify({itemReferenceHash: item.itemHash, itemId: iid, stackSize:1, characterId: item.characterId, membershipType})
    });
    const pmData = await pmResp.json();
    if (pmData.ErrorCode !== 1) {
      alert(`Bungie won't let this item be pulled from the Postmaster: ${pmData.Message}`);
      return;
    }
    item.inPostmaster = false;
    await new Promise(r=>setTimeout(r,300));
  }

  // Vault space check — any move that goes through vault needs room
  const vaultCount = allItems.filter(i=>i.loc==='Vault' && (WEAPON_BUCKETS.has(getEffectiveBucketHash(i))||ARMOR_BUCKETS.has(getEffectiveBucketHash(i)))).length;
  const needsVaultSpace = side === 'char' || (side === 'junk' && !isInVault);
  if (needsVaultSpace && vaultCount >= 1300) {
    alert('Vault is full (1300/1300). Clear some space before transferring.');
    return;
  }

  // Determine transfer direction
  let transferToVault, characterId;
  if (side === 'char') {
    // Character item → vault
    transferToVault = true;
    characterId = trashModeCharId;
  } else {
    // Junk item → character (from wherever it is)
    transferToVault = false;
    characterId = trashModeCharId;
    // If it's on another character, need to vault it first then transfer
    if (!isInVault && item.characterId !== trashModeCharId) {
      // Step 1: move to vault from source character
      const r1 = await fetch('https://www.bungie.net/Platform/Destiny2/Actions/Items/TransferItem/', {
        method:'POST', headers,
        body: JSON.stringify({itemReferenceHash: item.itemHash, itemId: iid, stackSize:1, characterId: item.characterId, transferToVault: true, membershipType})
      });
      const d1 = await r1.json();
      if (d1.ErrorCode !== 1) { alert(`Transfer failed: ${d1.Message}`); return; }
      await new Promise(r=>setTimeout(r,300));
    }
  }

  const resp = await fetch('https://www.bungie.net/Platform/Destiny2/Actions/Items/TransferItem/', {
    method:'POST', headers,
    body: JSON.stringify({itemReferenceHash: item.itemHash, itemId: iid, stackSize:1, characterId, transferToVault, membershipType})
  });
  const data = await resp.json();
  if (data.ErrorCode !== 1) { alert(`Transfer failed: ${data.Message}`); return; }

  // Update local state
  if (transferToVault) {
    item.loc = 'Vault';
    item.characterId = null;
    item.equipped = false;
  } else {
    item.loc = CLASS_NAMES[allItems.find(i=>i.characterId===trashModeCharId&&i.equipped)?.classType]||'Character';
    item.characterId = trashModeCharId;

    // Workaround for Bungie API bug: transferring onto a character can silently
    // lock the item if another copy in that bucket was locked. Re-assert the
    // correct lock state right after landing, so it doesn't get clobbered.
    await new Promise(r=>setTimeout(r,400));
    try {
      console.log(`[lock-correction] item ${iid}: re-asserting locked=${wasLocked} on character ${characterId}`);
      const lockResp = await fetch('https://www.bungie.net/Platform/Destiny2/Actions/Items/SetLockState/', {
        method:'POST', headers,
        body: JSON.stringify({state: wasLocked, itemId: iid, characterId, membershipType})
      });
      const lockData = await lockResp.json();
      console.log(`[lock-correction] response:`, lockData);
      if (lockData.ErrorCode === 1) {
        item.state = wasLocked ? (item.state | 1) : (item.state & ~1);
        inGameLockState[iid] = wasLocked;
      } else {
        console.warn(`[lock-correction] Bungie rejected the corrective call:`, lockData.Message);
      }
    } catch(e) { console.warn('[lock-correction] request failed:', e); }
  }
  renderTrashMode();
}

// Hover tooltip
function startHoverTimer(event, iid) {
  clearHoverTimer();
  hoverTimer = setTimeout(()=>showItemTooltip(event, iid), 1500);
}
function clearHoverTimer() {
  if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer=null; }
  if (hoverTooltip) { hoverTooltip.remove(); hoverTooltip=null; }
}
function showItemTooltip(event, iid) {
  const item = allItems.find(i=>i.itemInstanceId===iid);
  if (!item) return;
  const def = getItemDef(item.itemHash);
  const inst = instanceData[iid];
  const stats = statsData[iid];
  const socks = socketData[iid];
  const name = def?.displayProperties?.name||'Item';
  const type = def?.itemTypeDisplayName||'';
  const tier = def?.inventory?.tierType||0;
  const rk = RARITY[tier]||'common';
  const power = inst?.primaryStat?.value||'—';
  const isWeapon = WEAPON_BUCKETS.has(getEffectiveBucketHash(item));
  const iconPath = def?.displayProperties?.hasIcon ? `https://www.bungie.net${def.displayProperties.icon}` : '';
  const flavorText = def?.flavorText||'';
  const mw = isMasterworked(iid);

  // Rarity colors
  const rarityColors = {exotic:'#ceae33',legendary:'#7a4c96',rare:'#5076a3',uncommon:'#366f42',common:'#c3bcb4'};
  const rarityColor = rarityColors[rk]||'#c3bcb4';

  // Intrinsic frame (socket 0)
  let intrinsicHtml = '';
  if (socks?.sockets?.[0]?.plugHash) {
    const pd = getItemDef(socks.sockets[0].plugHash);
    const pname = pd?.displayProperties?.name||'';
    const pdesc = pd?.displayProperties?.description||'';
    const picon = pd?.displayProperties?.hasIcon ? `https://www.bungie.net${pd.displayProperties.icon}` : '';
    if (pname && !pname.toLowerCase().includes('empty')) {
      intrinsicHtml = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.08);margin:8px 0;">
        ${picon?`<img src="${picon}" style="width:32px;height:32px;flex-shrink:0;" />`:''}
        <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text);">${pname}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${pdesc}</div></div>
      </div>`;
    }
  }

  // Weapon perk columns
  let perksHtml = '';
  if (isWeapon && socks?.sockets) {
    const cols = extractWeaponCols(item, iid, socks);
    if (cols.length) {
      perksHtml = `<div style="display:grid;grid-template-columns:repeat(${cols.length},1fr);gap:6px;margin-bottom:8px;">
        ${cols.map(col=>`<div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;border-bottom:1px solid var(--border);padding-bottom:3px;">${col.label}</div>
          ${col.hashes.map(h=>{
            const pd=getItemDef(h); const pn=pd?.displayProperties?.name||'';
            const isEq = h===col.equippedHash;
            return `<div style="font-size:11px;padding:2px 0;color:${isEq?'var(--text)':'var(--text-muted)'};font-weight:${isEq?700:400};">${pn}</div>`;
          }).join('')}
        </div>`).join('')}
      </div>`;
    }
  }

  // Armor stats
  let statsHtml = '';
  if (!isWeapon && stats?.stats) {
    const entries = ARMOR_STAT_HASHES.map(h=>({n:ARMOR_STAT_NAMES[h],v:stats.stats[h]?.value||0})).filter(s=>s.v>0);
    const total = entries.reduce((a,s)=>a+s.v,0);
    if (entries.length) {
      statsHtml = `<div style="margin-bottom:8px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;">Stats <span style="color:var(--accent);">${total}</span></div>
        ${entries.map(s=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
          <div style="font-size:10px;color:var(--text-muted);width:52px;flex-shrink:0;">${s.n}</div>
          <div style="flex:1;height:3px;background:var(--surface2);">
            <div style="height:3px;width:${Math.min(s.v,100)}%;background:var(--accent);"></div>
          </div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text);width:20px;text-align:right;">${s.v}</div>
        </div>`).join('')}
      </div>`;
    }
  }

  // Weapon stats
  let wStatsHtml = '';
  if (isWeapon && stats?.stats) {
    const entries = WEAPON_STAT_HASHES.map(h=>({n:WEAPON_STAT_NAMES[h],v:stats.stats[h]?.value})).filter(s=>s.v!==undefined&&s.v>0);
    if (entries.length) {
      wStatsHtml = `<div style="margin-bottom:8px;">
        ${entries.map(s=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
          <div style="font-size:10px;color:var(--text-muted);width:72px;flex-shrink:0;">${s.n}</div>
          <div style="flex:1;height:3px;background:var(--surface2);">
            <div style="height:3px;width:${Math.min(s.v,100)}%;background:var(--accent);"></div>
          </div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text);width:24px;text-align:right;">${s.v}</div>
        </div>`).join('')}
      </div>`;
    }
  }

  const tt = document.createElement('div');
  tt.style.cssText = `position:fixed;z-index:9999;background:#0e1015;border:1px solid ${rarityColor};padding:0;max-width:280px;min-width:220px;pointer-events:none;font-family:'Barlow',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.7);`;
  tt.innerHTML = `
    <div style="height:4px;background:${rarityColor};"></div>
    <div style="padding:10px 12px;">
      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
        ${iconPath?`<div style="position:relative;width:56px;height:56px;flex-shrink:0;background:var(--surface2);${mw?'outline:2px solid var(--exotic-col);outline-offset:-2px;':''}"><img src="${iconPath}" style="width:100%;height:100%;object-fit:cover;display:block;" />${tierPipsSvg(gearTierOf(iid),'lg')}${isCrafted(iid)?`<div style="position:absolute;bottom:2px;left:2px;line-height:0;">${craftedIconInline(13)}</div>`:''}</div>`:''}
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.2;">${name}</div>
          <div style="font-size:10px;color:${rarityColor};margin-top:2px;text-transform:uppercase;letter-spacing:.06em;">${type}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--accent);">${power}</div>
            <div style="display:flex;align-items:center;line-height:0;">${locBadgeSvg(item)}</div>
            <span style="font-size:10px;color:var(--text-muted);">${item.loc||''}${item.equipped?' · Equipped':''}</span>
          </div>
        </div>
      </div>
      ${intrinsicHtml}
      ${perksHtml}
      ${statsHtml}
      ${wStatsHtml}
      ${flavorText?`<div style="font-size:10px;color:var(--text-dim);font-style:italic;border-top:1px solid rgba(255,255,255,0.06);padding-top:6px;margin-top:6px;">"${flavorText}"</div>`:''}
    </div>`;

  document.body.appendChild(tt);
  hoverTooltip = tt;

  const ttW = 280, ttH = 400;
  const x = Math.min(event.clientX + 14, window.innerWidth - ttW - 10);
  const y = Math.min(event.clientY + 14, window.innerHeight - ttH - 10);
  tt.style.left = x+'px';
  tt.style.top  = y+'px';
}

// ===================== INIT =====================
(async function init() {
  buildDamageIconMap();
  updateOAuthStatus();
  initThemePicker();
  applyTheme(currentTheme, currentAccent);
  syncHideCraftedBtn();
  // Handle OAuth callback redirect - auto-load profile after login
  if (window.location.search.includes('code=')) {
    const ok = await handleOAuthCallback();
    if (ok) searchPlayer();
  } else if (isOAuthValid()) {
    // Already logged in - auto-load guardian
    searchPlayer();
  } else {
    // Try token refresh
    const refreshed = await refreshOAuthToken();
    if (refreshed) { updateOAuthStatus(); searchPlayer(); }
  }
})();

// ===================== KEYBOARD =====================
document.addEventListener('keydown', e=>{ if (e.key==='Escape') { closeCompare(); clearHoverTimer(); } });
document.addEventListener('click', ()=>{ clearHoverTimer(); });
document.getElementById('previewId')?.addEventListener('keydown', e=>{ if(e.key==='Enter') previewPlayer(); });
document.getElementById('compareOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeCompare(); });
</script>
