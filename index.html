<body>
<div class="page">

  <div class="header">
    <div class="logo-mark"><div class="logo-inner"></div></div>
    <h1>Destiny 2 <span>Item Compare</span></h1>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <button id="refreshBtn" onclick="refreshProfile()" style="display:none;background:var(--surface);border:1px solid var(--border2);color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;cursor:pointer;align-items:center;gap:6px;">
        <span>↻</span><span id="refreshLabel">Refresh</span>
      </button>
    </div>
  </div>

  <div class="form-row" id="loginRow">
    <div id="oauthStatus"></div>
    <div id="previewRow" style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);">— or preview —</span>
      <input type="text" id="previewId" placeholder="Bungie ID (e.g. Wood#5589)"
        style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:6px 10px;outline:none;width:200px;" />
      <button onclick="previewPlayer()" style="background:var(--surface2);color:var(--text-muted);border:1px solid var(--border2);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;cursor:pointer;">Preview</button>
      <span style="font-size:11px;color:var(--text-dim);">Read-only · No perk rolls · No lock sync</span>
    </div>
  </div>

  <div id="error" class="error"></div>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Searching…</div>
  </div>

  <div id="app">
    <div class="main-tabs">
      <button class="main-tab active" onclick="switchMain('characters')">Characters</button>
      <button class="main-tab" onclick="switchMain('weapons')">Weapons</button>
      <button class="main-tab" onclick="switchMain('armor')">Armor</button>
      <button class="main-tab" onclick="switchMain('trashmode')">Work Mode</button>
      <button id="markReadBtn" onclick="markAllSeen()" style="display:none;margin-left:auto;background:none;border:1px solid var(--fav);color:var(--fav);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;cursor:pointer;">Mark All Read</button>
    </div>
    <div id="panel-characters" class="main-panel active"></div>
    <div id="panel-weapons" class="main-panel"></div>
    <div id="panel-armor" class="main-panel"></div>
    <div id="panel-trashmode" class="main-panel"></div>
  </div>

</div>
<div style="position:fixed;bottom:10px;right:14px;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;color:var(--text-dim);pointer-events:none;z-index:999;">v140</div>

<!-- Starfield canvas -->
<canvas id="starCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1s;"></canvas>

<!-- Theme Toggle Button + Panel (bottom-left) -->
<div style="position:fixed;bottom:10px;left:14px;z-index:1000;font-family:'Barlow Condensed',sans-serif;">
  <button id="themeToggleBtn" onclick="toggleThemePanel()" style="display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border2);color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;cursor:pointer;border-radius:var(--radius-sm);">
    <span>Theme</span><span id="themeArrow" style="font-size:8px;transition:transform 0.2s;">▲</span>
  </button>
  <div id="themePicker" style="display:none;background:var(--surface);border:1px solid var(--border2);border-bottom:none;padding:12px 14px;width:220px;margin-bottom:0;border-radius:var(--radius) var(--radius) 0 0;">
    <div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">Main Theme</div>
    <div style="display:flex;gap:6px;margin-bottom:12px;">
      <div class="theme-swatch" data-theme="starfield" title="Starfield" style="flex:1;height:44px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background:#0a0c0f;">
        <canvas class="swatch-canvas" width="58" height="44" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
        <span style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.7);">Stars</span>
      </div>
      <div class="theme-swatch" data-theme="class-0" title="Titan" style="flex:1;height:44px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background:#0a0c0f;">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(200,168,75,0.4) 0%,transparent 70%);border-bottom:2px solid rgba(200,168,75,0.5);"></div>
        <span style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.8);">Titan</span>
      </div>
      <div class="theme-swatch" data-theme="class-1" title="Hunter" style="flex:1;height:44px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background:#0a0c0f;">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(74,159,212,0.4) 0%,transparent 70%);border-bottom:2px solid rgba(74,159,212,0.5);"></div>
        <span style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.8);">Hunter</span>
      </div>
      <div class="theme-swatch" data-theme="class-2" title="Warlock" style="flex:1;height:44px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background:#0a0c0f;">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(155,111,196,0.4) 0%,transparent 70%);border-bottom:2px solid rgba(155,111,196,0.5);"></div>
        <span style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.8);">Warlock</span>
      </div>
      <div class="theme-swatch" data-theme="destiny" title="Destiny UI" style="flex:1;height:44px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background:#0a0c0f;">
        <svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 58 44"><polygon points="29,4 52,17 52,39 29,44 6,39 6,17" fill="none" stroke="rgba(200,168,75,0.4)" stroke-width="1"/><line x1="0" y1="0" x2="29" y2="22" stroke="rgba(200,168,75,0.15)" stroke-width="8"/></svg>
        <span style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.7);">Destiny</span>
      </div>
    </div>
    <div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">Accent</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;">
      <div class="accent-swatch" data-accent="auto" title="Auto (most used)" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:linear-gradient(135deg,#888 0%,#4a9fd4 33%,#c8a84b 66%,#9b6fc4 100%);"></div>
      <div class="accent-swatch" data-accent="1" title="Kinetic" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:#c0c0c8;"></div>
      <div class="accent-swatch" data-accent="2" title="Arc" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:#79c2f4;"></div>
      <div class="accent-swatch" data-accent="3" title="Solar" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:#f07833;"></div>
      <div class="accent-swatch" data-accent="4" title="Void" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:#7857a8;"></div>
      <div class="accent-swatch" data-accent="6" title="Stasis" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:#4d97c4;"></div>
      <div class="accent-swatch" data-accent="7" title="Strand" style="width:26px;height:26px;cursor:pointer;border:2px solid transparent;background:#4fce96;"></div>
    </div>
    <div style="margin-top:12px;">
      <div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;">Brightness</div>
      <input type="range" id="themeBrightness" min="1" max="10" value="5"
        style="width:100%;accent-color:var(--accent);cursor:pointer;" />
    </div>
  </div>
</div>
