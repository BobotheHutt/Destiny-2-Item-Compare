name: Bump Version

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip bump]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        run: |
          CURRENT=$(grep -oP 'APP_VERSION = \K[0-9]+' version.js)
          NEXT=$((CURRENT + 1))
          sed -i "s/APP_VERSION = $CURRENT/APP_VERSION = $NEXT/" version.js
          echo "Bumped version from $CURRENT to $NEXT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.js
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "v$(grep -oP 'APP_VERSION = \K[0-9]+' version.js) [skip bump]"
          git push
